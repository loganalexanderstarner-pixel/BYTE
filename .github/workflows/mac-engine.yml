name: Mac engine test

# Builds llama-server with Metal and runs the end-to-end tests against a real
# model, when engine-related code changes (or by hand).
on:
  push:
    branches: ["**"]
    paths:
      - "src-tauri/src/engine.rs"
      - "src-tauri/src/chat.rs"
      - "src-tauri/src/agent.rs"
      - "src-tauri/src/tools/**"
      - "src-tauri/src/speed.rs"
      - "src-tauri/src/tune.rs"
      - "src-tauri/src/summarize.rs"
      # Mac-only code (Apple Vision text recognition) compiles and is tested only here.
      - "src-tauri/src/ocr.rs"
      - "src-tauri/src/macctl.rs"
      - "src-tauri/src/macctl_tests.rs"
      - "src-tauri/src/files.rs"
      - "src-tauri/src/embed.rs"
      - "src-tauri/src/kb.rs"
      - "src-tauri/src/study.rs"
      # The web agent saves pages with WKWebView (web_agent/capture_mac.rs).
      - "src-tauri/src/web_agent/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "scripts/LLAMA_TAG"
      - "scripts/build-llama-server.sh"
      - ".github/workflows/mac-engine.yml"
  workflow_dispatch:

concurrency:
  group: mac-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Real engine on macOS (Metal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: .cache/llama.cpp
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/LLAMA_TAG', 'scripts/build-llama-server.sh') }}
      - name: Build engine (llama-server, Metal)
        run: scripts/build-llama-server.sh
      - name: Build frontend (embedded into the app)
        run: npm ci && npm run build
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: test-model-qwen3-0.6b-q8
      - name: Download small test model
        run: |
          mkdir -p .cache/models
          f=.cache/models/Qwen3-0.6B-Q8_0.gguf
          [ -f "$f" ] || curl -fsSL -o "$f" "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true"
          echo "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  $f" | shasum -a 256 -c
      - name: Cache Speed boost test models
        uses: actions/cache@v4
        with:
          path: .cache/boost
          key: boost-qwen3.5-2b-0.8b-q4km
      - name: Download Speed boost test models (Qwen3.5 2B + 0.8B helper)
        run: |
          mkdir -p .cache/boost
          for m in Qwen3.5-2B Qwen3.5-0.8B; do
            f=.cache/boost/$m-Q4_K_M.gguf
            [ -f "$f" ] || curl -fsSL -o "$f" "https://huggingface.co/unsloth/$m-GGUF/resolve/main/$m-Q4_K_M.gguf?download=true"
          done
      - name: Cache speed-up head test models
        uses: actions/cache@v4
        with:
          path: .cache/head
          key: head-gemma-4-e2b-q3km-mtp
      - name: Download speed-up head test models (Gemma 4 E2B + its MTP head)
        run: |
          mkdir -p .cache/head
          for f in gemma-4-E2B-it-Q3_K_M.gguf mtp-gemma-4-E2B-it.gguf; do
            [ -f ".cache/head/$f" ] || curl -fsSL -o ".cache/head/$f" "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/$f?download=true"
          done
      - name: Cache embedding test model
        uses: actions/cache@v4
        with:
          path: .cache/embed
          key: embed-nomic-v1.5-q8
      - name: Download embedding test model (nomic-embed-text v1.5)
        run: |
          mkdir -p .cache/embed
          f=.cache/embed/nomic-embed-text-v1.5.Q8_0.gguf
          [ -f "$f" ] || curl -fsSL -o "$f" "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q8_0.gguf?download=true"
          echo "3e24342164b3d94991ba9692fdc0dd08e3fd7362e0aacc396a9a5c54a544c3b7  $f" | shasum -a 256 -c
      - name: End-to-end test against the real engine
        working-directory: src-tauri
        env:
          BYTE_TEST_LLAMA_SERVER: ${{ github.workspace }}/src-tauri/binaries/llama-server-aarch64-apple-darwin
          BYTE_TEST_MODEL: ${{ github.workspace }}/.cache/models/Qwen3-0.6B-Q8_0.gguf
          BYTE_TEST_MAIN_MODEL: ${{ github.workspace }}/.cache/boost/Qwen3.5-2B-Q4_K_M.gguf
          BYTE_TEST_DRAFT_MODEL: ${{ github.workspace }}/.cache/boost/Qwen3.5-0.8B-Q4_K_M.gguf
          BYTE_TEST_HEAD_MAIN: ${{ github.workspace }}/.cache/head/gemma-4-E2B-it-Q3_K_M.gguf
          BYTE_TEST_HEAD: ${{ github.workspace }}/.cache/head/mtp-gemma-4-E2B-it.gguf
          BYTE_TEST_EMBED_MODEL: ${{ github.workspace }}/.cache/embed/nomic-embed-text-v1.5.Q8_0.gguf
        run: cargo test --locked e2e -- --ignored --nocapture --test-threads=1
