name: CI

# Runs once per push (the repo is public, so Actions minutes are free); a
# pull_request trigger too would run every push twice. Docs-only pushes skip it.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tools/ui-shots/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No secrets in the repository (it's public)
        run: scripts/check-secrets.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  rust:
    # Unit tests run on Linux: GitHub bills macOS minutes at 10x on private
    # repositories. The real-engine test runs on macOS in mac-engine.yml.
    name: Rust unit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Placeholder engine sidecar (tauri-build requires the file)
        run: |
          mkdir -p src-tauri/binaries dist && echo "<!doctype html>" > dist/index.html
          touch src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

  windows:
    # Not a Windows app yet (docs/DESIGN-AND-PLATFORMS.md): this keeps the Rust
    # core compiling there, so Mac-only code stays behind #[cfg(target_os = "macos")].
    name: Rust core compiles on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Placeholder engine sidecar (tauri-build requires the file)
        run: |
          mkdir -p src-tauri/binaries dist && echo "<!doctype html>" > dist/index.html
          touch src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe
      - name: cargo check (lib and tests)
        working-directory: src-tauri
        # SQLCipher's bundled OpenSSL is configured with perl; Git Bash's perl
        # lacks modules it needs, the runner's Strawberry Perl has them.
        env:
          PERL: C:\Strawberry\perl\bin\perl.exe
        run: cargo check --locked --all-targets
