name: Release BYTE

# Tags name the phase: v0.5.0 = Phase 5, v0.5.1 = a Phase 5 improvement build
# (docs/VERSIONS.md). Tags with a "-" (e.g. v0.6.0-beta.1) publish a hidden
# pre-release for testing; v1.0.0 is the finished app.
on:
  push:
    tags: ["v*"]
  # Manual runs build the chosen branch and create the tag + release for it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create for this build, e.g. v1.0.0-test.1"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check versions match the tag
        run: node scripts/bump.mjs --check "${TAG#v}"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: .cache/llama.cpp
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/LLAMA_TAG', 'scripts/build-llama-server.sh') }}

      - name: Build engine (llama-server, Metal)
        run: TARGET_TRIPLE=aarch64-apple-darwin scripts/build-llama-server.sh

      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: .cache/whisper.cpp
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/WHISPER_TAG', 'scripts/build-whisper.sh') }}

      - name: Build voice engine (whisper-cli, Metal)
        run: TARGET_TRIPLE=aarch64-apple-darwin scripts/build-whisper.sh

      - name: Cache sherpa-onnx build
        uses: actions/cache@v4
        with:
          path: .cache/sherpa-onnx
          key: sherpa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/SHERPA_TAG', 'scripts/build-sherpa.sh') }}

      - name: Build speaker-label and voice tools (sherpa-onnx)
        run: TARGET_TRIPLE=aarch64-apple-darwin scripts/build-sherpa.sh

      - run: npm ci

      # Title and description from docs/releases/<tag>.md (first line "# Title"),
      # so every version on the Releases page says what it has. Falls back to
      # a plain title when the file doesn't exist.
      - name: Release notes
        id: notes
        run: |
          f="docs/releases/${TAG}.md"
          if [ -f "$f" ]; then
            title=$(head -n1 "$f" | sed 's/^# *//')
            body=$(tail -n +2 "$f")
          else
            title="BYTE ${TAG}"
            body=""
          fi
          {
            echo "title=$title"
            echo "body<<BYTE_NOTES_END"
            echo "$body"
            echo
            echo "## Install"
            echo "**Apple Silicon Macs (M1 or newer), macOS 13.3+.** Download the \`.dmg\`, open it, and drag BYTE to Applications."
            echo
            echo "**First launch:** BYTE isn't signed with an Apple Developer ID yet, so macOS will block it the first time."
            echo "- macOS 15 (Sequoia) or later: open BYTE once, click **Done**, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**."
            echo "- macOS 13–14: right-click BYTE in Applications → **Open** → **Open**."
            echo "- If macOS says the app is \"damaged\", run this in Terminal: \`xattr -cr /Applications/BYTE.app\`"
            echo "BYTE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # One-click updates (updater.rs) need the owner's signing key as a secret. Without it the
      # release is built as before, just without the signed update files.
      - name: Signed updates (when the signing key is set up)
        id: updater
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret, so this release has no one-click update files."
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: ${{ steps.notes.outputs.title }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          args: --target aarch64-apple-darwin ${{ steps.updater.outputs.args }}

      - name: Verify the bundle contains the engine
        run: |
          app=$(ls -d src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app | head -n1)
          test -x "$app/Contents/MacOS/llama-server"
          test -x "$app/Contents/MacOS/whisper-cli"
          test -x "$app/Contents/MacOS/sherpa-diarize"
          test -x "$app/Contents/MacOS/sherpa-tts"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/llama-server" --version
          "$app/Contents/MacOS/whisper-cli" --help >/dev/null

      # The .dmg is also kept on the run's page, so a build can be downloaded
      # even if publishing the release fails (e.g. the token is read-only).
      - name: Keep the .dmg as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BYTE-${{ env.TAG }}-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
