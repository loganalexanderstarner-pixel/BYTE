[package]
name = "byte"
version = "0.11.0"
description = "BYTE — a local-first AI assistant for Apple Silicon Macs"
authors = ["Logan Starner"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "byte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-os = "2.4"
tauri-plugin-log = "2.10"
tauri-plugin-process = "2.4"
tauri-plugin-opener = "2.6"
tauri-plugin-global-shortcut = "2"
# Reminders, finished briefings and scheduled runs (scheduler.rs).
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
plist = "1"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
log = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "gzip", "brotli", "http2", "charset", "multipart"] }

sysinfo = "0.39"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"

# Web search & reading
scraper = "0.27"
dom_smoothie = "0.18"
url = "2"
base64 = "0.22"
# Exact math, units and dates for the calculator tool
fend-core = "1.5"
# Encrypted local database (chats, memories); SQLCipher with a vendored OpenSSL so
# nothing extra is needed on the Mac.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
pdf-extract = "0.12"
quick-xml = "0.37"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Cloud mode: the API key lives in the macOS Keychain, never in files.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Reading text in photos and scanned PDFs (Apple Vision + PDFKit, see ocr.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSString", "NSValue"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSPasteboard"] }
# The web agent saves pages as PDF / picture / web archive (web_agent/capture_mac.rs).
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKPDFConfiguration", "WKSnapshotConfiguration"] }
block2 = "0.6"

[dev-dependencies]
lopdf = "0.42"
tempfile = "3"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
