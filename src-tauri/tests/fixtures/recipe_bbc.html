<!doctype html><html><head><title>Classic lasagne recipe</title><script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "name": "x"}, {"@context": "https://schema.org", "@type": "Recipe", "name": "Classic lasagne", "description": "Prepare this easy homemade lasagne ahead of time and save in the freezer, uncooked, for when you need it during a busy week. Just bake for an extra 45 mins", "image": [{"@type": "ImageObject", "url": "https://images.immediate.co.uk/production/volatile/sites/30/2023/11/Lasagne-d4cb438.jpg?resize=768,845", "width": 768, "height": 845}, {"@type": "ImageObject", "url": "https://images.immediate.co.uk/production/volatile/sites/30/2023/11/Lasagne-d4cb438.jpg?resize=1366,1503", "width": 1366, "height": 1503}], "recipeYield": 6, "prepTime": "PT20M", "cookTime": "PT1H40M", "totalTime": "PT2H", "recipeIngredient": ["2 olive oil plus extra for the dish", "750g lean beef mince", "90g pack prosciutto", "800g passata or half our basic tomato sauce", "200ml hot beef stock", "nutmeg", "300g fresh lasagne sheets", "white sauce (find a recipe in the method, or use shop-bought)", "125g ball mozzarella torn into thin strips"], "recipeInstructions": [{"@type": "HowToStep", "text": "To make the meat sauce,\u00a0heat 2 tbsp olive oil in a frying pan and cook 750g lean beef mince in two batches for about 10 mins until browned all over."}, {"@type": "HowToStep", "text": "Finely chop 4 slices of prosciutto from a 90g pack, then stir through the meat mixture."}, {"@type": "HowToStep", "text": "Pour over 800g passata or half our basic tomato sauce recipe and 200ml hot beef stock. Add a little grated nutmeg, then season."}, {"@type": "HowToStep", "text": "Bring up to the boil, then simmer for 30 mins until the sauce looks rich."}, {"@type": "HowToStep", "text": "Heat the oven to 180C/160C fan/gas 4 and lightly oil an ovenproof dish (about 30 x 20cm)."}, {"@type": "HowToStep", "text": "Spoon one third of the meat sauce into the dish, then cover with some fresh lasagne sheets from a 300g pack. Drizzle over roughly 130g ready-made or homemade white sauce."}, {"@type": "HowToStep", "text": "Repeat until you have three layers of pasta. Cover with the remaining 390g white sauce, making sure you can\u2019t see any pasta poking through."}, {"@type": "HowToStep", "text": "Scatter 125g torn mozzarella over the top."}, {"@type": "HowToStep", "text": "Arrange the rest of the prosciutto on top. Bake for 45 mins until the top is bubbling and lightly browned."}], "recipeCategory": "Dinner, Lunch, Main course", "recipeCuisine": "Italian", "author": [{"@type": "Person", "name": "Good Food team", "url": "https://www.bbcgoodfood.com/author/goodfood"}], "nutrition": {"@type": "NutritionInformation", "calories": "580 calories", "fatContent": "32 grams fat", "saturatedFatContent": "14 grams saturated fat", "carbohydrateContent": "31 grams carbohydrates", "sugarContent": "8 grams sugar", "fiberContent": "3 grams fiber", "proteinContent": "44 grams protein", "sodiumContent": "1.71 milligram of sodium"}}]}</script></head><body><article><h1>Classic lasagne</h1><p>Prepare this easy homemade lasagne ahead of time and save in the freezer, uncooked, for when you need it during a busy week. Just bake for an extra 45 mins</p></article></body></html>
