<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- BYTE: one byte, eight bits, two lit. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <rect x="134" y="336" width="150" height="150" rx="38" fill="#f5bd3c" fill-opacity="0.3"/>
  <rect x="336" y="336" width="150" height="150" rx="38" fill="#f5bd3c" fill-opacity="1" filter="url(#glow)"/>
  <rect x="538" y="336" width="150" height="150" rx="38" fill="#f5bd3c" fill-opacity="0.3"/>
  <rect x="740" y="336" width="150" height="150" rx="38" fill="#f5bd3c" fill-opacity="0.3"/>
  <rect x="134" y="538" width="150" height="150" rx="38" fill="#f5bd3c" fill-opacity="0.3"/>
  <rect x="336" y="538" width="150" height="150" rx="38" fill="#f5bd3c" fill-opacity="0.3"/>
  <rect x="538" y="538" width="150" height="150" rx="38" fill="#f5bd3c" fill-opacity="1" filter="url(#glow)"/>
  <rect x="740" y="538" width="150" height="150" rx="38" fill="#f5bd3c" fill-opacity="0.3"/>
</svg>
