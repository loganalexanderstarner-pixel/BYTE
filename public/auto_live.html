<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BYTE is working</title>
<style>
  html, body { margin: 0; background: #0e1018; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; color: #e8ecf4; user-select: none; }
  #box { padding: 10px 12px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; border: 1px solid #2a3042; }
  #top { display: flex; align-items: center; gap: 8px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #3ddc97; animation: pulse 1.2s ease-in-out infinite; flex: none; }
  .waiting #dot { background: #f5b942; } .paused #dot { background: #8a93a6; animation: none; }
  .done #dot { background: #4aa8ff; animation: none; } .stopped #dot, .failed #dot { background: #ff6b6b; animation: none; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #stage { color: #aab2c3; font-size: 12px; }
  #now { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next { color: #8a93a6; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { height: 6px; border-radius: 3px; background: #232838; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #3ddc97; transition: width 0.3s; }
  #row { display: flex; gap: 8px; margin-top: auto; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; color: #fff; background: #3a4258; }
  #stop { flex: 1; background: #d64545; font-weight: 700; font-size: 15px; padding: 10px 12px; }
  #stop:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.7; } 50% { transform: scale(1.25); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #dot { animation: none !important; } }
</style>
</head>
<body>
<div id="box" class="running">
  <div id="top"><span id="dot"></span><span id="title"></span></div>
  <div id="stage"></div>
  <div id="now"></div>
  <div id="next"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="row"><button id="pause">Pause</button><button id="stop">Stop</button></div>
</div>
<script>
  var inv = function (cmd) { try { return window.__TAURI_INTERNALS__.invoke(cmd); } catch (e) { return null; } };
  var paused = false;
  document.getElementById("stop").onclick = function () { inv("auto_stop"); };
  document.getElementById("pause").onclick = function () { inv(paused ? "auto_resume" : "auto_pause"); };
  window.setLive = function (v) {
    var box = document.getElementById("box");
    box.className = v.status || "running";
    paused = v.status === "paused";
    document.getElementById("title").textContent = v.title || "";
    document.getElementById("stage").textContent = v.stagesTotal ? "Stage " + Math.max(v.stage, 1) + " of " + v.stagesTotal : "";
    var now = v.status === "waiting" ? "Waiting for your answer" : v.status === "done" ? "Finished" : v.status === "stopped" ? "Stopped" : v.status === "failed" ? "Stopped: something did not finish" : (v.note && v.status === "paused") ? v.note : (v.now || "Starting");
    document.getElementById("now").textContent = "Now: " + now;
    document.getElementById("next").textContent = v.next ? "Next: " + v.next : "";
    document.getElementById("fill").style.width = (v.percent || 0) + "%";
    document.getElementById("pause").textContent = paused ? "Resume" : "Pause";
    var over = ["done", "stopped", "failed"].indexOf(v.status) >= 0;
    document.getElementById("row").style.display = over ? "none" : "flex";
  };
</script>
</body>
</html>
